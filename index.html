<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tin Whistle Workshop</title>
<meta name="description" content="Learn the Irish tin whistle: fingerings shown live while the score plays, adjustable speed, metronome, loops and any whistle key.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='13' y='1' width='6' height='30' rx='2' fill='%231d6a4e'/%3E%3Ccircle cx='16' cy='12' r='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='18' r='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='24' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Uncial+Antiqua&display=swap">
<style>
/* Layout : bandeau de réglages en haut, puis la flûte (colonne collante à gauche) face à la partition (à droite). Sur téléphone, la flûte passe à l'horizontale et reste collée en haut. */
:root {
  --paper: #eef2ee;
  --surface: #ffffff;
  --ink: #15302a;
  --muted: #5b6d66;
  --line: #d3ddd7;
  --accent: #a26f12;
  --accent-soft: #f4e6c8;
  --green: #1d6a4e;
  --green-soft: #dcebe3;
  --warn: #9a3d1c;
  --head: #1d6a4e;
  --head-dark: #10402f;
  --tube-a: #c9cfcc;
  --tube-b: #f6f8f7;
  --tube-edge: #8f9995;
  --hole-closed: #15302a;
  --hole-open: #ffffff;
  --hole-ring: #15302a;
  --font-display: "Uncial Antiqua", "Georgia", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1613; --surface: #15201c; --ink: #e3ece7; --muted: #94a69e; --line: #2a3a34;
    --accent: #dcaa4f; --accent-soft: #3a2f19; --green: #55b88f; --green-soft: #1a3329; --warn: #e08a63;
    --head: #2a8a64; --head-dark: #155a40; --tube-a: #7d8784; --tube-b: #c3cbc8; --tube-edge: #56605c;
    --hole-closed: #0b1411; --hole-open: #eef3f0; --hole-ring: #0b1411;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1613; --surface: #15201c; --ink: #e3ece7; --muted: #94a69e; --line: #2a3a34;
  --accent: #dcaa4f; --accent-soft: #3a2f19; --green: #55b88f; --green-soft: #1a3329; --warn: #e08a63;
  --head: #2a8a64; --head-dark: #155a40; --tube-a: #7d8784; --tube-b: #c3cbc8; --tube-edge: #56605c;
  --hole-closed: #0b1411; --hole-open: #eef3f0; --hole-ring: #0b1411;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* En-tête */
.top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; padding-block: 22px 4px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 38px); line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.brand h1 span { color: var(--green); }
.brand p { margin: 4px 0 0; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; border: 2px solid var(--hole-ring); }
.legend .c { background: var(--hole-closed); }
.legend .o { background: var(--hole-open); }
.legend .h { background: linear-gradient(90deg, var(--hole-closed) 50%, var(--hole-open) 50%); }

/* Bandeau de réglages */
.toolbar { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
.tunes-group { grid-row: span 2; }
.search { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font: inherit; color: inherit; }
.filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.results { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); max-height: 236px; overflow-y: auto; display: flex; flex-direction: column; }
.res { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 7px 10px; cursor: pointer; font-size: 14px; }
.res:last-child { border-bottom: 0; }
.res:hover { background: var(--green-soft); }
.res[aria-selected="true"] { background: var(--green); color: var(--surface); }
.res[aria-selected="true"] small { color: var(--surface); }
.res span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
.dot.half { background: var(--accent); }
.dot.range { background: var(--muted); }
.res[aria-selected="true"] .dot { outline: 2px solid var(--surface); }
.empty { padding: 14px 10px; color: var(--muted); font-size: 13px; }
.fitkey { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.fitkey span { display: inline-flex; align-items: center; gap: 5px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.label { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
select, textarea, button { font: inherit; color: inherit; }
select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 6px 10px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--surface); }
.seg button:disabled { opacity: .5; cursor: not-allowed; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
.btn:hover { border-color: var(--green); }
.btn.primary { background: var(--green); color: var(--surface); border-color: var(--green); min-width: 112px; justify-content: center; }
.btn.primary:hover { filter: brightness(1.08); }
.btn svg { width: 15px; height: 15px; fill: currentColor; }
.btn.small { padding: 5px 10px; font-size: 13px; font-weight: 400; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tempo { display: flex; align-items: center; gap: 10px; flex: 1 1 200px; min-width: 0; }
.tempo input { flex: 1; accent-color: var(--green); min-width: 80px; }
.tempo output { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13.5px; user-select: none; }
.switch input { appearance: none; width: 32px; height: 18px; border-radius: 9px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }
.switch input:disabled { opacity: .45; }

/* Scène */
.stage { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.whistle-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
#whistle svg { width: 100%; height: auto; display: block; max-height: calc(100vh - 80px); }
.readout { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.note-big { font-family: var(--font-display); font-size: 46px; line-height: 1; color: var(--green); }
.note-en { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.badges { display: flex; flex-direction: column; gap: 5px; }
.badge { font-size: 12.5px; padding: 4px 8px; border-radius: 6px; background: var(--green-soft); color: var(--ink); line-height: 1.3; }
.badge.warn { background: var(--accent-soft); }
.next { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.next .mini { width: 100%; }
.next .mini svg { width: 100%; height: auto; display: block; }
.next b { display: block; font-size: 18px; }
.next span { color: var(--muted); font-size: 12px; }
.counter { font-family: var(--font-display); font-size: 64px; color: var(--accent); line-height: 1; text-align: center; }

.score-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 10px; min-width: 0; }
.score-head { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; align-items: baseline; }
.score-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.k { border-color: var(--green); color: var(--green); }
.desc { color: var(--muted); margin: 6px 0 4px; max-width: 70ch; }
#score { color: var(--ink); overflow-x: auto; }
#score svg { display: block; }
#score .abcjs-title { display: none; }
#score .abcjs-note, #score .abcjs-rest { cursor: pointer; }
#score .hl, #score .hl path { fill: var(--accent) !important; stroke: var(--accent); }
.view-row { margin-top: 8px; }
.passage { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.num { width: 64px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font: inherit; color: inherit; font-variant-numeric: tabular-nums; }
.btn:disabled { opacity: .5; cursor: not-allowed; border-color: var(--line); }
#score .mnum { fill: var(--muted); font: 9px var(--font-mono); pointer-events: none; }
#score .pass { fill: var(--accent-soft); pointer-events: none; }
#score .tab { pointer-events: none; }
#score .tab .tc { fill: var(--ink); }
#score .tab .to { fill: var(--surface); stroke: var(--ink); stroke-width: .9; }
#score .tab .tp { fill: var(--accent); font: 700 11px var(--font-body); }
#score .tab.hlt .tc { fill: var(--accent); }
#score .tab.hlt .to { stroke: var(--accent); stroke-width: 1.4; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 6px 0 4px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); }

/* Doigtés & ajouts */
details.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
details.panel summary { cursor: pointer; font-weight: 700; }
details.panel summary small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.chart { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; margin-top: 14px; }
.cell { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.cell:hover { border-color: var(--green); }
.cell svg { width: 20px; height: auto; display: block; }
.cell b { font-size: 13px; }
.cell small { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.custom { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.sources .label { grid-column: 1 / -1; }
.sources a { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); text-decoration: none; }
.sources a:hover { border-color: var(--green); }
.sources a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sources a b { color: var(--green); }
.sources a b::after { content: " ↗"; font-weight: 400; }
.sources a span { font-size: 13px; color: var(--muted); }
textarea { width: 100%; min-height: 170px; font-family: var(--font-mono); font-size: 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); padding: 10px; resize: vertical; }
.msg { font-size: 13px; margin: 0; }
.msg.err { color: var(--warn); }
.msg.ok { color: var(--green); }
.credits { color: var(--muted); font-size: 12.5px; max-width: 80ch; }

@media (max-width: 820px) {
  .toolbar { grid-template-columns: minmax(0, 1fr); }
  .tunes-group { grid-row: auto; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .whistle-panel { top: env(safe-area-inset-top, 0px); z-index: 5; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 8px 10px; border-radius: 0 0 var(--r) var(--r); box-shadow: 0 6px 14px -10px rgba(0,0,0,.35); }
  #whistle svg { max-height: none; }
  .readout { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
  .note-big { font-size: 32px; }
  .badges { flex-direction: row; flex-wrap: wrap; }
  .next { border-top: 0; padding-top: 0; margin-left: auto; }
  .next .mini { display: none; }
  .counter { font-size: 34px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
}
@media (prefers-reduced-motion: no-preference) {
  .hole { transition: fill .12s ease; }
}
.top-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.langpick { display: inline-flex; align-items: center; gap: 8px; }
.langpick select { width: auto; padding: 5px 8px; }
.credits a, .author a { color: var(--green); }
.io { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px; }
.credits-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.credits-box p { margin: 0; }
.author { font-size: 15px; }
.author a { font-weight: 700; }
@media (max-width: 820px) {
  .top-side { align-items: flex-start; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-i18n-html="brand">Tin Whistle <span>Workshop</span></h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="top-side">
      <label class="langpick"><span class="label" data-i18n="language">Language</span><select id="lang"></select></label>
      <div class="legend" data-i18n-aria="legendAria">
        <span><i class="c"></i><span data-i18n="closed"></span></span>
        <span><i class="o"></i><span data-i18n="open"></span></span>
        <span><i class="h"></i><span data-i18n="half"></span></span>
        <span><b>+</b> <span data-i18n="plus2"></span></span>
      </div>
    </div>
  </header>

  <section class="toolbar" data-i18n-aria="settings">
    <div class="group tunes-group">
      <label class="label" for="search" data-i18n="tune"></label>
      <input type="search" class="search" id="search" data-i18n-ph="searchPh" autocomplete="off">
      <div class="filters">
        <select id="level" data-i18n-aria="levelAria"></select>
        <select id="rhythm" data-i18n-aria="rhythmAria"></select>
      </div>
      <label class="switch"><input type="checkbox" id="fits"><span data-i18n="fitsOnly"></span></label>
      <div class="results" id="results" role="listbox" data-i18n-aria="tunesAria"></div>
      <div class="fitkey">
        <span><i class="dot"></i><span data-i18n="fitOk"></span></span>
        <span><i class="dot half"></i><span data-i18n="fitHalf"></span></span>
        <span><i class="dot range"></i><span data-i18n="fitRange"></span></span>
      </div>
      <p class="hint" id="tuneHint"></p>
    </div>
    <div class="group">
      <label class="label" for="whistleKey" data-i18n="whistleKey"></label>
      <select id="whistleKey"></select>
      <div class="row">
        <div class="seg" role="group" data-i18n-aria="modeAria">
          <button type="button" id="modeSame" aria-pressed="true" data-i18n="modeSame"></button>
          <button type="button" id="modeReal" aria-pressed="false" data-i18n="modeReal"></button>
        </div>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>
    <div class="group play-group">
      <span class="label" data-i18n="playback"></span>
      <div class="row">
        <button type="button" class="btn primary" id="play"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2.5v11l9-5.5z"/></svg><span id="playLabel"></span></button>
        <button type="button" class="btn" id="stop" data-i18n-aria="stopAria"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg><span data-i18n="stop"></span></button>
        <div class="tempo">
          <label for="speed" class="hint" data-i18n="speed"></label>
          <input type="range" id="speed" min="30" max="150" step="5" value="70">
          <output id="speedOut" for="speed"></output>
        </div>
      </div>
      <div class="toggles">
        <label class="switch"><input type="checkbox" id="metro"><span data-i18n="metro"></span></label>
        <label class="switch"><input type="checkbox" id="countin" checked><span data-i18n="countin"></span></label>
        <label class="switch"><input type="checkbox" id="melody" checked><span data-i18n="melody"></span></label>
        <label class="switch"><input type="checkbox" id="loop"><span data-i18n="loop"></span></label>
      </div>
      <div class="passage">
        <span class="label" data-i18n="passage"></span>
        <div class="row">
          <label for="fromBar" class="hint" data-i18n="fromBar"></label>
          <input type="number" id="fromBar" class="num" min="1" value="1" inputmode="numeric">
          <label for="toBar" class="hint" data-i18n="toBar"></label>
          <input type="number" id="toBar" class="num" min="1" value="1" inputmode="numeric">
          <span class="hint" id="barTotal"></span>
          <button type="button" class="btn small" id="wholeTune" data-i18n="wholeTune"></button>
        </div>
        <div class="row">
          <button type="button" class="btn small" id="setFrom" disabled></button>
          <button type="button" class="btn small" id="setTo" disabled></button>
        </div>
        <p class="hint" id="passHint"></p>
      </div>
    </div>
  </section>

  <main class="stage">
    <aside class="whistle-panel" aria-live="polite">
      <div id="whistle"></div>
      <div class="readout">
        <div id="counter" class="counter" hidden></div>
        <div id="noteBox">
          <div class="note-big" id="noteName"></div>
          <div class="note-en" id="noteEn"></div>
        </div>
        <div class="badges" id="badges"></div>
        <div class="next" id="nextBox">
          <div class="mini" id="nextWhistle"></div>
          <div><span data-i18n="next"></span><b id="nextName">–</b></div>
        </div>
      </div>
    </aside>

    <section class="score-panel">
      <div class="score-head">
        <h2 id="tuneTitle"></h2>
        <div class="meta" id="tuneMeta"></div>
      </div>
      <div class="row view-row">
        <span class="label" data-i18n="view"></span>
        <div class="seg" role="group" data-i18n-aria="viewAria">
          <button type="button" id="viewStaff" aria-pressed="true" data-i18n="viewStaff"></button>
          <button type="button" id="viewTab" aria-pressed="false" data-i18n="viewTab"></button>
        </div>
      </div>
      <p class="desc" id="tuneDesc"></p>
      <div class="progress"><i id="progress"></i></div>
      <div id="score"></div>
      <p class="hint" data-i18n="scoreHint"></p>
    </section>
  </main>

  <details class="panel" id="chartPanel" open>
    <summary><span data-i18n="chart"></span> <small id="chartSub"></small></summary>
    <div class="chart" id="chart"></div>
  </details>

  <details class="panel" id="customPanel">
    <summary><span data-i18n="custom"></span> <small data-i18n="customSub"></small></summary>
    <div class="custom">
      <div class="sources">
        <span class="label" data-i18n="sources"></span>
        <a href="https://thesession.org/tunes" target="_blank" rel="noopener noreferrer"><b>thesession.org</b><span data-i18n="srcSession"></span></a>
